name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Audit production dependencies
        if: matrix.node == '22'
        run: npm audit --omit=dev --audit-level=moderate
      - name: Self-audit (strict, generic provider)
        run: node ./bin/dotdeployer.js audit . --provider generic --strict
      - name: Generate a SARIF report
        if: matrix.node == '22'
        run: node ./bin/dotdeployer.js audit . --provider generic --sarif > dotdeployer.sarif
      - name: Upload the SARIF report
        if: matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: dotdeployer-sarif
          path: dotdeployer.sarif
