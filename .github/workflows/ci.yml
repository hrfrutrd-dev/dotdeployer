name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (with TOML support on old Pythons)
        run: python -m pip install --upgrade pip ".[toml]"

      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip ruff
      - run: ruff check src tests

  package:
    name: build and install the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/dd-venv
          /tmp/dd-venv/bin/python -m pip install dist/*.whl
          /tmp/dd-venv/bin/dotdeployer --version
          /tmp/dd-venv/bin/dd --version

  smoke:
    name: end-to-end smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Scaffold a project and walk the whole lifecycle
        run: |
          set -eux
          export HOME="$(mktemp -d)"
          mkdir -p "$HOME"

          dotdeployer init "$HOME/dotfiles"
          cd "$HOME/dotfiles"

          dotdeployer doctor
          dotdeployer config validate
          dotdeployer plan

          pending=$(dotdeployer status --check >/dev/null; echo $?)
          test "$pending" = 12

          # a pre-existing file gives `apply` something to back up
          echo "# existing zshrc" > "$HOME/.zshrc"

          dotdeployer apply --yes
          dotdeployer status            # 0 once everything is in sync
          dotdeployer list --status
          dotdeployer report -o report.html
          test -s report.html

          # local edits are reported as drift, and --strict turns that into a failure
          echo "# drift" >> "$HOME/.zshrc"
          drift=$(dotdeployer diff --strict >/dev/null; echo $?)
          test "$drift" = 11
          dotdeployer plan --all

          dotdeployer rollback --last --yes
          grep -q "# existing zshrc" "$HOME/.zshrc"

          dotdeployer uninstall --yes

      - name: A minimal project is valid too
        run: |
          set -eux
          export HOME="$(mktemp -d)"
          mkdir -p "$HOME"
          dotdeployer init "$HOME/dotfiles" --minimal
          cd "$HOME/dotfiles"
          dotdeployer doctor
          dotdeployer config validate

  windows:
    name: windows (best effort)
    runs-on: windows-latest
    continue-on-error: true   # symlink creation needs privileges the runner may not grant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Scaffold and plan a project
        shell: bash
        run: |
          set -eux
          export HOME="$(mktemp -d)"
          mkdir -p "$HOME"
          dotdeployer init "$HOME/dotfiles"
          cd "$HOME/dotfiles"
          dotdeployer doctor
          dotdeployer plan
